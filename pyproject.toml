[project]
name = "edxso-influencer-outreach"
version = "0.1.0"
description = "Automated micro-influencer discovery, enrichment, and outreach pipeline (EDXSO Assignment 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "tenacity>=8.3",
  "python-dotenv>=1.0",
  "typer>=0.12",
  "rich>=13.7",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "email-validator>=2.1",
  "yt-dlp>=2024.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
llm = ["openai>=1.40"]

[project.scripts]
influencer-outreach = "influencer_outreach.cli:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
